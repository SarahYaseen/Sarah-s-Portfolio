<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="background: radial-gradient(circle, #1a1a1a 0%, #0d0d0d 100%); border-radius: 16px;">
  <defs>
    <!-- Golden Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="meshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <!-- Dropshadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="220" fill="url(#meshGlow)" />

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="10 5" opacity="0.6" />
  <circle cx="250" cy="250" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3" />

  <!-- Stylized Geometric Portrait / Monogram SY Group -->
  <g filter="url(#shadow)">
    <!-- Base Shape (Shield/Hexagon Backdrop) -->
    <path d="M 250,110 L 350,170 L 350,290 L 250,350 L 150,290 L 150,170 Z" fill="#111111" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Gold Geometric Facet accents -->
    <path d="M 250,110 L 250,230 L 150,170 Z" fill="url(#goldGrad)" opacity="0.15" />
    <path d="M 250,110 L 350,170 L 250,230 Z" fill="url(#goldGrad)" opacity="0.05" />
    <path d="M 250,350 L 250,230 L 350,290 Z" fill="url(#goldGrad)" opacity="0.2" />
    <path d="M 250,350 L 150,290 L 250,230 Z" fill="url(#goldGrad)" opacity="0.1" />

    <!-- Stylized Monogram S and Y -->
    <!-- 'S' Path -->
    <path d="M 210,180 C 210,165 230,160 250,160 C 270,160 290,170 290,185 C 290,205 210,215 210,235 C 210,250 230,260 250,260 C 270,260 290,250 290,240" 
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
          
    <!-- 'Y' Path intersecting below -->
    <path d="M 220,285 L 250,315 L 280,285 M 250,315 L 250,335" 
          fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  </g>

  <!-- Technical Corner Accents -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 470 50 L 470 30 L 450 30" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 30 450 L 30 470 L 50 470" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 470 450 L 470 470 L 450 470" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Subtitle Text -->
  <text x="250" y="390" text-anchor="middle" fill="#F5F5F0" font-family="'Montserrat', sans-serif" font-weight="700" font-size="16" letter-spacing="4" opacity="0.9">SARA YASEEN</text>
  <text x="250" y="415" text-anchor="middle" fill="url(#goldGrad)" font-family="'Montserrat', sans-serif" font-weight="500" font-size="10" letter-spacing="6">PORTFOLIO</text>
</svg>
