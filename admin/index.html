<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarah Yaseen | Portfolio CMS Admin</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              DEFAULT: '#D4AF37',
              hover: '#C9A227',
              glow: 'rgba(212, 175, 55, 0.15)',
              border: 'rgba(212, 175, 55, 0.25)'
            },
            dark: {
              DEFAULT: '#0A0A0A',
              secondary: '#111111',
              tertiary: '#161616'
            },
            cream: '#F5F5F0',
            mutedText: '#A0A09A'
          },
          fontFamily: {
            montserrat: ['Montserrat', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts Montserrat -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Quill WYSIWYG Editor Styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css">
  
  <!-- Custom Admin Stylesheet -->
  <link rel="stylesheet" href="/admin/css/admin.css">

  <!-- React & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Quill WYSIWYG Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
</head>
<body class="bg-dark text-cream font-montserrat min-h-screen">

  <div id="root">
    <!-- React App will mount here -->
    <div class="flex items-center justify-center min-h-screen bg-dark">
      <div class="text-center">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-gold mb-4"></i>
        <p class="text-mutedText uppercase tracking-widest text-xs">Loading CMS Admin Panel...</p>
      </div>
    </div>
  </div>

  <!-- Load Admin API Client and App Core -->
  <script src="/admin/js/api.js" type="text/javascript"></script>
  <script src="/admin/js/app.js" type="text/babel"></script>

</body>
</html>
